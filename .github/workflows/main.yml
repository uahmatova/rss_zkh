name: Update RSS Feed

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install feedparser requests beautifulsoup4

    - name: Run RSS merger
      env:
        VK_TOKEN: ${{ secrets.VK_TOKEN }}
      run: python rss_merger.py

    - name: Prepare file for GitHub Pages
      run: |
        mkdir -p docs
        cp merged_feed.xml docs/
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"  # <-- ИСПРАВЛЕНО!
        git add docs/merged_feed.xml
        git diff --staged --quiet || git commit -m "Обновлена RSS-лента [skip ci]"

    - name: Push changes to repository
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: dev
